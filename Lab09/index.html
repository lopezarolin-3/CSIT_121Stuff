<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee XML Viewer</title>
    <style>
    .home-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 30px;
      backdrop-filter: blur(6px);
      transition: 0.3s;
    }
    
    .home-btn:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.2);
    }
    
    .home-btn::after {
      content: "";
      z-index: -1;
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #333;
      left: 0;
      top: 0;
      border-radius: 10px;
    }
    /* home-btn glow styling */
    .home-btn::before {
      content: "";
      background: linear-gradient(
        45deg,
        rgb(255, 0, 0),
        rgb(255, 115, 0),
        rgb(255, 251, 0),
        rgb(72, 255, 0),
        rgb(0, 255, 213),
        rgb(0, 43, 255),
        rgb(255, 0, 200),
        rgb(255, 0, 0)
      );
      position: absolute;
      top: -2px;
      left: -2px;
      background-size: 600%;
      z-index: -1;
      width: calc(100% + 4px);
      height:  calc(100% + 4px);
      filter: blur(8px);
      animation: glowing 20s linear infinite;
      transition: opacity .3s ease-in-out;
      border-radius: 10px;
      opacity: 0;
    }
    
    @keyframes glowing {
      0% {background-position: 0 0;}
      50% {background-position: 400% 0;}
      100% {background-position: 0 0;}
    }
    
    /* home-btn hover styling */
    .card:hover::before {
      opacity: 1;
    }
    
    .home-btn:active:after {
      background: transparent;
    }
    
    .home-btn:active {
      color: #000;
      font-weight: bold;
    }
    
    </style>
    <link rel="stylesheet" href="style.css">

    
    <script>
        let isLoaded = false;
        let isVisible = false;

        function loadXMLDoc() {
            let xmlhttp = new XMLHttpRequest();

            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    empDetails(this);
                }
            };

            xmlhttp.open("GET", "employee.xml", true);
            xmlhttp.send();
        }

        function empDetails(xml) {
            let xmlDoc = xml.responseXML;

            let table =
                `<tr>
                    <th>Firstname</th>
                    <th>Lastname</th>
                    <th>Title</th>
                    <th>Division</th>
                    <th>Building</th>
                    <th>Room</th>
                </tr>`;

            let x = xmlDoc.getElementsByTagName("employee");

            for (let i = 0; i < x.length; i++) {
                table += `<tr>
                    <td>${x[i].getElementsByTagName("firstname")[0].textContent}</td>
                    <td>${x[i].getElementsByTagName("lastname")[0].textContent}</td>
                    <td>${x[i].getElementsByTagName("title")[0].textContent}</td>
                    <td>${x[i].getElementsByTagName("division")[0].textContent}</td>
                    <td>${x[i].getElementsByTagName("building")[0].textContent}</td>
                    <td>${x[i].getElementsByTagName("room")[0].textContent}</td>
                </tr>`;
            }

            document.getElementById("id").innerHTML = table;
        }

        // TOGGLE BUTTON FUNCTION
        function toggleTable() {
            let table = document.getElementById("id");
            let btn = document.getElementById("toggleBtn");

            if (!isVisible) {
                if (!isLoaded) {
                    loadXMLDoc();
                    isLoaded = true;
                }

                table.style.display = "table";
                btn.innerText = "Hide Employee Data";
                isVisible = true;

            } else {
                table.style.display = "none";
                btn.innerText = "Show Employees";
                isVisible = false;
            }
        }
    </script>
</head>

<body>
        <button type="button" class="button" onclick="toggleTable()" id="toggleBtn">
            Get Employee Data
        </button>

    <br><br>

    <table id="id"></table>
